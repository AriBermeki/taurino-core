[package]
name = "taurino-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
serialize-to-javascript ="0.1.2"
schemars = { version = "0.8.21", features = ["url", "uuid1"], optional = true }
serde_with = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
log = "0.4.21"
url = { version = "2", features = ["serde"] }
dpi = { version = "0.1", features = ["serde"] }
http = "1.1"
glob = "0.3.4"
json-patch = "4.0"
# Our code requires at least 0.3.1
urlpattern = "0.6"
regex = "1"
walkdir = { version = "2" }
memchr = "2"
semver = "1"
infer = "0.22"
dunce = "1"
ctor = { version = "1.0", default-features = false }
tao = { version = "0.35.0", default-features = false, features = ["rwh_06"] }
wry = { version = "0.55.0", default-features = false, features = [
  "protocol",
  "os-webview",
  "linux-body",
] }


[target."cfg(windows)".dependencies]
webview2-com = "0.38"
softbuffer = { version = "0.4", default-features = false }
once_cell = "1.20"

[target."cfg(windows)".dependencies.windows]
version = "0.61"
features = ["Win32_Foundation", "Win32_Graphics_Dwm"]

[target."cfg(any(target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\"))".dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "=2.0", features = ["v2_40"] }
percent-encoding = "2"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "block2",
  "NSApplication",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSScreen",
  "NSGraphics",
] }

[target."cfg(target_os = \"android\")".dependencies]
jni = "0.21"




[features]
default = ["x11", "dbus"]
common-controls-v6 = []
schema = ["schemars"]
dbus = ["tao/dbus"]
x11 = ["tao/x11"]
macos-private-api = [
  "wry/fullscreen",
  "wry/transparent",
]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-linux-android",
  "x86_64-apple-ios",
]



[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
debug-assertions = false
overflow-checks = false
